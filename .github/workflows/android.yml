name: Auto-build (auto-update + APK)

on:
  push:
    branches: [ "main" ]
  schedule:
    # every day at 06:00 UTC — keeps Morphe patches + TeleVip addon up to date
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # --- auto-update -------------------------------------------------------
      # 1) latest Morphe patches (submodules track the NexAlloy 'nexalloy' branch)
      # 2) latest TeleVip addon sources (addons/televip/update.sh)
      - name: Sync upstream patches (Morphe + TeleVip)
        run: |
          git submodule update --remote --init
          bash addons/televip/update.sh
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-sync Morphe submodules + TeleVip addon [skip ci]" || true
            git push origin HEAD:main
          fi

      # --- signing -----------------------------------------------------------
      # A stable keystore is persisted between runs via the Actions cache so
      # that successive auto-builds can be installed over each other.
      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: key.jks
          key: nexalloy-signing-keystore-v1

      - name: Generate signing keystore (first run only)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore key.jks -alias nexalloy \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass nexalloy123 -keypass nexalloy123 \
            -dname "CN=NexAlloy AutoBuild, OU=CI, O=NexAlloy, C=US"

      - name: Write signing.properties
        run: |
          cat > signing.properties <<'EOF'
          KEYSTORE_PASSWORD=nexalloy123
          KEYSTORE_ALIAS=nexalloy
          KEYSTORE_ALIAS_PASSWORD=nexalloy123
          KEYSTORE_FILE=../key.jks
          EOF

      # --- build -------------------------------------------------------------
      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexalloy-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Publish nightly release
        run: |
          SHA=$(git rev-parse --short HEAD)
          PATCHVER=$(grep '^version' morphe-patches/gradle.properties | cut -d= -f2 | tr -d ' ')
          TVCOMMIT=$(cat addons/televip/UPSTREAM_COMMIT 2>/dev/null || echo unknown)
          cp app/build/outputs/apk/release/app-release.apk "NexAlloy-${SHA}.apk"
          gh release delete autobuild --yes || true
          gh release create autobuild "NexAlloy-${SHA}.apk" \
            --prerelease \
            --title "Auto-build ${SHA}" \
            --notes "Automated build from ${SHA}. Morphe patches v${PATCHVER}. TeleVip @ ${TVCOMMIT}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
